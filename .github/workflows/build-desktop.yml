name: Native desktop build

on:
  workflow_dispatch:
    inputs:
      target:
        description: Platforms to build
        type: choice
        options: [macos, all]
        default: macos

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.target == 'macos' && '["macos-15", "macos-15-intel"]' || '["windows-latest", "ubuntu-latest", "macos-15", "macos-15-intel"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      QT_QPA_PLATFORM: offscreen
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          enable-cache: true
      - name: Linux GUI and credential libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 gnome-keyring dbus-x11
      - name: Install dependencies
        if: runner.os != 'macOS'
        run: uv sync --frozen
      - name: Build macOS PDF bindings with fixed SWIG
        if: runner.os == 'macOS'
        run: |
          uv sync --frozen --no-binary-package pymupdf --no-build-package cryptography
          uv run --frozen python -c "from pymupdf import _build; print('SWIG:', _build.swig_version); assert _build.swig_version_tuple >= (4, 4)"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Core and engine regression
        run: uv run pytest tests/unit/core tests/unit/engines tests/unit/services tests/unit/test_layering.py --no-cov
      - name: Build native package and frozen selftest
        if: runner.os != 'Linux'
        run: uv run python scripts/build_desktop.py
      - name: Verify extracted macOS bundle
        if: runner.os == 'macOS'
        run: uv run python scripts/verify_macos_package.py
      - name: Linux native build with system credential service
        if: runner.os == 'Linux'
        run: dbus-run-session -- sh scripts/ci_native_build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Lumen-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/Lumen-*.zip
            dist/macos-verification-*.json
          if-no-files-found: error

  verify-newer-macos:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            artifact: Lumen-macOS-ARM64
          - os: macos-26-intel
            artifact: Lumen-macOS-X64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          enable-cache: true
      - run: uv sync --frozen
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - name: Verify macOS 15-built package on newer macOS
        run: uv run python scripts/verify_macos_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: Lumen-compatibility-${{ matrix.os }}
          path: dist/macos-verification-*.json
          if-no-files-found: error
