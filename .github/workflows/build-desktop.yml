name: Native desktop build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          enable-cache: true
      - name: Linux Qt runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update
      - name: Linux GUI libraries
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 gnome-keyring dbus-x11
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Core and engine regression
        run: uv run pytest tests/unit/core tests/unit/engines tests/unit/services tests/unit/test_layering.py --no-cov
      - name: Build native package and frozen selftest
        if: runner.os != 'Linux'
        run: uv run python scripts/build_desktop.py
      - name: Linux native build with system credential service
        if: runner.os == 'Linux'
        run: dbus-run-session -- sh scripts/ci_native_build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Lumen-${{ runner.os }}-${{ runner.arch }}
          path: dist/Lumen-*.zip
          if-no-files-found: error
